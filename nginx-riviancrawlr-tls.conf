# HTTPS server block for riviancrawlr.com.
#
# NOT installed by default. Copy it to /etc/nginx/riviancrawlr-tls/ ONLY after
# the Cloudflare Origin Certificate exists at the paths below — nginx -t fails
# if ssl_certificate points at a missing file, and a failing config means the
# next nginx reload or restart takes the site down.
#
#   sudo mkdir -p /etc/nginx/riviancrawlr-tls
#   sudo cp nginx-riviancrawlr-tls.conf /etc/nginx/riviancrawlr-tls/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Only after this serves TLS correctly should Cloudflare be switched from
# Flexible to Full (strict). Flipping Cloudflare first returns 526 to visitors.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name riviancrawlr.com www.riviancrawlr.com;

    # Cloudflare Origin CA certificate (SSL/TLS -> Origin Server -> Create
    # Certificate). Valid only for connections coming from Cloudflare, which
    # is exactly this deployment. Not a publicly trusted cert — a browser
    # hitting the origin IP directly will warn, and that is expected.
    ssl_certificate     /etc/ssl/riviancrawlr/origin.pem;
    ssl_certificate_key /etc/ssl/riviancrawlr/origin.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS. Leave commented until HTTPS is confirmed working end to end —
    # browsers cache it for max-age and will refuse plain HTTP for that long,
    # so enabling it prematurely is painful to undo.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/riviancrawlr-common.conf;
}
