# Shared server-block body for riviancrawlr.com — included by BOTH the port-80
# and port-443 server blocks in nginx-riviancrawlr.conf / -tls.conf.
#
# It exists so the two blocks cannot drift apart. That is not hypothetical:
# the /static/ location previously declared its own add_header, which silently
# dropped every server-level security header for static responses, because
# nginx does not inherit add_header into a block that sets any of its own.
#
# Installed to /etc/nginx/riviancrawlr-common.conf

# ---- Real client IP from Cloudflare -------------------------------------
# Keep in sync with https://www.cloudflare.com/ips-v4/ and /ips-v6/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# IPv6 — riviancrawlr.com resolves to Cloudflare IPv6 addresses, so without
# these the real client IP is lost on every IPv6 edge connection and the login
# rate limiter buckets by Cloudflare's address instead of the visitor's.
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ---- Response headers ---------------------------------------------------
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

client_max_body_size 1m;
server_tokens off;

# ---- Proxy to the admin UI ----------------------------------------------
location / {
    proxy_pass http://127.0.0.1:8111;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

# Login form: throttle brute force at the edge, before it reaches uvicorn and
# bcrypt. burst=5 nodelay lets a mistyped password through; a scripted attack
# gets 429s.
location = /login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8111;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location /static/ {
    proxy_pass http://127.0.0.1:8111/static/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_cache_valid 200 1h;

    # Declaring any add_header here drops every one inherited from the server
    # block, so the whole set is repeated. See the note at the top of the file.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=3600" always;
}
