# Nginx reverse proxy for Gearshop Admin UI
#
# NOTE ON TLS: this listens on plain HTTP because Cloudflare is set to
# "Flexible" SSL — CF terminates TLS and talks to the origin unencrypted, so
# admin session cookies cross the public internet in the clear. Move CF to
# "Full (strict)" with an Origin Certificate and switch this to `listen 443
# ssl;`. See the README ("Hardening the origin") for the steps.

# Rate-limit zone for the login form. The admin app also limits per IP in
# process, but doing it here sheds the load before it reaches uvicorn/bcrypt.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name riviancrawlr.com www.riviancrawlr.com;

    # Only allow Cloudflare IPs (optional but recommended)
    # https://www.cloudflare.com/ips-v4/ and /ips-v6/
    # Uncomment the `allow` lines plus `deny all;` to reject direct origin hits.
    # Keep this list in sync with Cloudflare's published ranges.

    # Pass real client IP from Cloudflare.
    # IPv4 ranges
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6 ranges — riviancrawlr.com resolves to Cloudflare IPv6 addresses, so
    # without these the real client IP is lost on every IPv6 edge connection
    # and rate limiting buckets by Cloudflare's address instead.
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Admin panel is not a public site — keep it out of search indexes.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Security headers.
    # IMPORTANT: nginx's add_header does NOT inherit into a child block that
    # declares its own add_header — a location that sets even one header loses
    # ALL of these. Any location below that needs its own header must therefore
    # repeat the whole set (see /static/).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # No request to this app needs a large body; the config editor posts a form.
    client_max_body_size 1m;

    # Don't advertise the nginx version on errors.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Login form: throttle brute-force attempts at the edge. burst=5 nodelay
    # lets a person who fat-fingers their password a few times through, while
    # a scripted attack gets 429s.
    location = /login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Cache static assets.
    location /static/ {
        proxy_pass http://127.0.0.1:8111/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache_valid 200 1h;

        # Repeat the server-level headers: declaring Cache-Control here would
        # otherwise drop every one of them for static responses.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
