# Nginx reverse proxy for the RivianCrawlr admin UI.
#
# Installed to /etc/nginx/sites-available/riviancrawlr.com and symlinked into
# sites-enabled. The body shared by the HTTP and HTTPS server blocks lives in
# /etc/nginx/riviancrawlr-common.conf so the two cannot drift apart.
#
# TLS: this file only listens on port 80. The HTTPS block is a separate file
# (nginx-riviancrawlr-tls.conf) that is dropped into
# /etc/nginx/riviancrawlr-tls/ once a Cloudflare Origin Certificate exists on
# the box. The wildcard include below matches nothing until then, which nginx
# treats as fine — so this config is valid whether or not TLS is set up yet.
# See the README ("Hardening") for the full switchover.

# Rate-limit zone for the login form. The admin app also limits per IP in
# process, but doing it here sheds the load before it reaches uvicorn/bcrypt.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name riviancrawlr.com www.riviancrawlr.com;

    # Only allow Cloudflare IPs (optional but recommended). Uncomment the
    # allow lines plus `deny all;` to stop the origin IP being hit directly,
    # which bypasses Cloudflare's WAF and rate limiting entirely. Source the
    # ranges from the set in riviancrawlr-common.conf.
    # deny all;

    include /etc/nginx/riviancrawlr-common.conf;
}

# HTTPS server block, present only once certs are installed. A wildcard
# include with no matches is not an error, so this stays valid pre-TLS.
include /etc/nginx/riviancrawlr-tls/*.conf;
